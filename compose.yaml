services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quietchat
      POSTGRES_USER: quietchat
      POSTGRES_PASSWORD: quietchat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quietchat -d quietchat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://quietchat:quietchat@postgres:5432/quietchat
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["pnpm", "--filter", "@quiet-chat/api", "start"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://quietchat:quietchat@postgres:5432/quietchat
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_HOME_CHAT_ID: ${MAX_HOME_CHAT_ID:-}
      MAX_HOME_CHAT_URL: ${MAX_HOME_CHAT_URL:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALERT_ANTIFLOOD_MINUTES: ${ALERT_ANTIFLOOD_MINUTES:-15}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["pnpm", "--filter", "@quiet-chat/worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quietchat:quietchat@postgres:5432/quietchat
      WORKER_POLL_INTERVAL_MS: 5000
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_HOME_CHAT_ID: ${MAX_HOME_CHAT_ID:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-http://localhost:5173}
      ALERT_ANTIFLOOD_MINUTES: ${ALERT_ANTIFLOOD_MINUTES:-15}
      HOME_TIMEZONE: ${HOME_TIMEZONE:-Asia/Irkutsk}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: .
    command: ["pnpm", "--filter", "@quiet-chat/web", "start", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
